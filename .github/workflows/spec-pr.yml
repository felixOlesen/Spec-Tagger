name: Full Sweep of Spec and Tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['features/**', 'tests/**', 'spec_tagger/**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60 
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install "git+https://github.com/felixOlesen/Spec-Tagger@v0.1.0"
          pip install -r requirements.txt # Only necessary for the spectagger repo, should not be brought with on other projects
      
      - name: Run SpecTagger
        id: spec_tagger_testing
        run: |
          mkdir coverage_reports
          mkdir report
          spectagger --target_spec features --test_dir tests --test_command "coverage run --append -m pytest {tests}" --report --report_type json --coverage_report_path coverage_reports --coverage_library "python.coverage" --verbose
        continue-on-error: true
      - name: SpecTagger Results Review # Calls the spec review command, initiating LLM review of semantic drift and uncovered changes
        id: spec_tagger_review
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: spectagger spec-review --report_input report/report.json --model_provider nvidia_nim --model_name nvidia/nemotron-3.5-lightning-30b-a3b --include_semantic_drift_review --include_uncovered_implementation_review
        continue-on-error: true
      - uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('spectagger_findings.md')) return;
            const body = fs.readFileSync('spectagger_findings.md', 'utf8');
            const marker = '## Spec review';          
            const {data: comments} = await github.rest.issues.listComments({ # Writes the spectagger_findings.md as a github issue
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.startsWith(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else { # Creates Comment on the PR with the spectagger findings body
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
      # Fails the PR review if any tests fail, does so after the full test suite is run though
      - name: Gate on test failures
        if: steps.spec_tagger_testing.outcome == 'failure'
        run: |
          echo "::error::Linked tests failed"
          exit 1
