[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-tagger"
version = "0.0.2"
description = "Tag-based spec-to-test traceability and test runner"
requires-python = ">=3.10"

[project.scripts]
spectagger = "spec_tagger.main:main"

[tool.setuptools.packages.find]
include = ["spec_tagger*"]

[project.optional-dependencies]
ai = ["anthropic>=0.120", "litellm>=1.82", "python-dotenv>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"spec_tagger.tag_test.templates" = ["*"]
"spec_tagger.agent_skill" = ["**/*"]

[tool.ruff]
target-version = "py314"
